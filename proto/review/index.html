<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schiri-Sichtung</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1c1d1f;--muted:#6a6c70;--line:#dedcd5;--accent:#1f6f5c;--accent-ink:#fff;--warn:#b5651d;--bad:#a23b3b;--chip:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#141516;--card:#1d1f21;--ink:#ececea;--muted:#9a9c9f;--line:#303235;--accent:#3fa58a;--accent-ink:#0d1412;--warn:#e0954d;--bad:#e06b6b;--chip:#2a2c2f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:650;letter-spacing:.2px}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.progress{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:pan-y;transition:transform .18s ease,opacity .18s ease}
.card.swipe-r{transform:translateX(40px) rotate(1.5deg);opacity:.4}.card.swipe-l{transform:translateX(-40px) rotate(-1.5deg);opacity:.4}.card.swipe-u{transform:translateY(-30px);opacity:.4}
video{display:block;width:100%;max-height:62vh;background:#000}
.vbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.vbar button{background:var(--chip);border:0;border-radius:6px;padding:4px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.vbar button.on{background:var(--accent);color:var(--accent-ink)}
.body{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 16px}
@media (max-width:720px){.body{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{border-radius:999px;padding:2px 10px;font-size:13px;background:var(--chip)}
.badge.whistled{background:var(--accent);color:var(--accent-ink)}.badge.candidate{background:var(--warn);color:#fff}
h2{font-size:22px;margin:4px 0;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}
.ai{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ai h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.ai .dec{font-size:18px;font-weight:650}
.conf{height:6px;background:var(--chip);border-radius:3px;margin:6px 0}.conf i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
.actions button{border:0;border-radius:10px;padding:12px 8px;cursor:pointer;font-weight:600}
.b-ok{background:var(--accent);color:var(--accent-ink)}.b-no{background:var(--chip)}.b-fix{background:var(--warn);color:#fff}
.kbd{display:block;font-weight:400;font-size:12px;opacity:.8}
form{display:none;padding:0 16px 16px;gap:10px;grid-template-columns:1fr 1fr}
form.open{display:grid}
form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
form textarea{grid-column:1/-1;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px}
form .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
form button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.saved{padding:0 16px 14px;color:var(--accent);font-size:13px;min-height:20px}
.nav{display:flex;justify-content:space-between;margin-top:10px}
.nav button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.help{margin-top:14px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Schiri-Sichtung</h1>
  <select id="match" aria-label="Spiel"></select>
  <div class="seg" id="role" role="group" aria-label="Rolle">
    <button data-v="self" class="on">Selbstbewertung</button><button data-v="observer">Beobachter</button>
  </div>
  <div class="seg" id="filter" role="group" aria-label="Filter">
    <button data-v="open" class="on">Offen</button><button data-v="all">Alle</button><button data-v="whistled">Pfiffe</button><button data-v="candidate">Verdacht</button>
  </div>
  <span class="progress" id="progress"></span>
</header>
<main id="main"><div class="empty">Lade …</div></main>

<script>
const DEC = {foul:"Foul",no_foul:"Kein Foul",unclear:"Unklar",not_a_foul_situation:"Keine Foulsituation",relevant:"Relevant"};
const FOUL = {tackle:"Tackling",push:"Stoßen",hold:"Halten",trip:"Beinstellen",charge:"Rempeln",strike:"Schlagen",handball:"Handspiel",dangerous_play:"Gefährliches Spiel",impeding:"Behindern",other:"Sonstiges",none:"–"};
const SAN = {none:"Keine Karte",yellow:"Gelb",red:"Rot"};
const PITCH = {grossfeld:"Großfeld",verkuerzt:"verkürztes Großfeld",kleinfeld:"Kleinfeld"};
const CTYPE = {foul_suspect:"Foulverdacht",handball_suspect:"Handspielverdacht",fall:"Sturz",hard_duel:"Harter Zweikampf",flag:"Fahne",card:"Karte",confrontation:"Rudelbildung",other:"Sonstiges"};
const S = {matchId:null,data:null,role:"self",filter:"open",idx:0,list:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts = (o, sel) => Object.entries(o).map(([k,v]) => `<option value="${k}" ${k===sel?"selected":""}>${v}</option>`).join("");

async function init(){
  const matches = await (await fetch("/api/matches")).json();
  if(!matches.length){ $("#main").innerHTML = '<div class="empty">Noch kein Spiel analysiert.<br>python -m schiri analyze &lt;video&gt;</div>'; return; }
  $("#match").innerHTML = matches.map(m => `<option value="${esc(m.id)}">${esc(label(m))}</option>`).join("");
  $("#match").onchange = e => load(e.target.value);
  seg("#role", v => { S.role = v; rebuild(true); });
  seg("#filter", v => { S.filter = v; rebuild(true); });
  try { const r = localStorage.getItem("schiri-role"); if(r){ S.role = r; setSeg("#role", r); } } catch(e){}
  load(matches[0].id);
}
function label(m){ const x = m.match || {}, p = x.pitch || {};
  return [x.date, x.home && x.away ? `${x.home} – ${x.away}` : m.id, PITCH[p.type], x.referee].filter(Boolean).join(" · "); }
function seg(sel, cb){ document.querySelectorAll(sel+" button").forEach(b => b.onclick = () => { setSeg(sel, b.dataset.v); if(sel==="#role"){ try{localStorage.setItem("schiri-role", b.dataset.v)}catch(e){} } cb(b.dataset.v); }); }
function setSeg(sel, v){ document.querySelectorAll(sel+" button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); }
async function load(id){ S.matchId = id; S.data = await (await fetch(`/api/matches/${encodeURIComponent(id)}`)).json(); rebuild(true); }
const key = sc => (sc.clip || sc.id).split("/").pop().replace(".mp4", "");   // stable across re-analysis
const rev = sc => S.data.reviews[`${key(sc)}:${S.role}`];
function rebuild(reset){
  const all = S.data.scenes;
  S.list = all.filter(sc => S.filter === "all" || (S.filter === "open" ? !rev(sc) : sc.type === S.filter));
  if(reset) S.idx = 0;
  S.idx = Math.min(S.idx, Math.max(0, S.list.length - 1));
  const done = all.filter(rev).length;
  $("#progress").textContent = `${done}/${all.length} gesichtet`;
  render();
}
function render(){
  const sc = S.list[S.idx];
  if(!sc){ $("#main").innerHTML = `<div class="empty">${S.filter==="open" ? "Alle Szenen gesichtet." : "Keine Szenen in diesem Filter."}</div>`; return; }
  const ai = sc.ai, r = rev(sc), c = sc.candidate;
  const aiHtml = ai ? `<div class="dec">${esc(DEC[ai.decision]||ai.decision)}${ai.sanction && ai.sanction!=="none" ? " · "+esc(SAN[ai.sanction]) : ""}</div>
      <div>${esc(FOUL[ai.foul_type]||"")} ${ai.rule_ref ? `<span class="muted">· ${esc(ai.rule_ref)}</span>` : ""}</div>
      <div class="conf" title="Sicherheit"><i style="width:${Math.round((ai.confidence||0)*100)}%"></i></div>
      <div>${esc(ai.reason)}</div><div class="muted">Sicherheit ${Math.round((ai.confidence||0)*100)} % · ${esc(ai.model||"")}</div>`
    : `<div class="muted">Kein KI-Vorschlag für diese Szene.</div>`;
  $("#main").innerHTML = `
  <article class="card" id="card">
    <video id="vid" src="/media/${encodeURIComponent(S.matchId)}/${esc(sc.clip)}" autoplay muted loop playsinline preload="auto"></video>
    <div class="vbar">
      <button id="snd">Ton an</button>
      <button data-rate="1" class="on">1×</button><button data-rate="0.5">0,5×</button><button data-rate="0.25">0,25×</button>
      <button id="back">−1 Bild</button><button id="fwd">+1 Bild</button>
      <span class="muted">${sc.type==="whistled" ? "Pfiff" : "Szene"} bei ${(sc.t_event - sc.start).toFixed(1).replace(".", ",")} s im Clip</span>
    </div>
    <div class="body">
      <div>
        <div class="meta"><span class="badge ${sc.type}">${sc.type==="whistled" ? "Gepfiffen" : "Kein Pfiff · Verdacht"}</span>
          <span class="badge">${esc(sc.detected_by.join(" + "))}</span><span class="badge">${S.idx+1} / ${S.list.length}</span></div>
        <h2>${esc(sc.time_label)} <span class="muted">(${sc.minute}. Videominute)</span></h2>
        ${c ? `<div><b>${esc(CTYPE[c.type]||c.type)}</b> – ${esc(c.description)} ${c.location ? `<span class="muted">· ${esc(c.location)}</span>` : ""}</div>` : ""}
        ${sc.whistle ? `<div class="muted">Pfiff ${sc.whistle.duration.toFixed(1)} s · ${Math.round(sc.whistle.peak_hz)} Hz · Erkennung ${Math.round(sc.whistle.confidence*100)} %</div>` : ""}
        ${r ? `<div class="muted" style="margin-top:8px">Bereits gesichtet: ${esc(actionLabel(r))}</div>` : ""}
      </div>
      <div class="ai"><h3>KI-Vorschlag</h3>${aiHtml}</div>
    </div>
    <div class="actions">
      <button class="b-no" id="aNo">Verwerfen<span class="kbd">← · kein relevanter Vorfall</span></button>
      <button class="b-fix" id="aFix">Korrigieren<span class="kbd">↑ · eigene Bewertung</span></button>
      <button class="b-ok" id="aOk">${ai ? "Vorschlag übernehmen" : "Relevant"}<span class="kbd">→</span></button>
    </div>
    <form id="form">
      <label>Entscheidung<select name="decision">${opts({foul:"Foul",no_foul:"Kein Foul",unclear:"Unklar",not_a_foul_situation:"Keine Foulsituation"}, r?.decision || ai?.decision)}</select></label>
      <label>Schiri lag richtig?<select name="referee_correct">${opts({"":"–",yes:"Ja",no:"Nein",partly:"Teilweise"}, r?.referee_correct || "")}</select></label>
      <label>Foulart<select name="foul_type">${opts(FOUL, r?.foul_type || ai?.foul_type || "none")}</select></label>
      <label>Persönliche Strafe<select name="sanction">${opts(SAN, r?.sanction || ai?.sanction || "none")}</select></label>
      <textarea name="comment" placeholder="Kommentar (z. B. Stellungsspiel, Vorteil, Körpersprache)">${esc(r?.comment || "")}</textarea>
      <div class="row"><button type="button" id="fCancel">Abbrechen</button><button type="submit" class="b-ok">Speichern</button></div>
    </form>
    <div class="saved" id="saved"></div>
  </article>
  <div class="nav"><button id="prev">‹ Zurück</button><button id="next">Weiter ›</button></div>
  <p class="help">Tastatur: → übernehmen · ← verwerfen · ↑ korrigieren · Leertaste Pause · , und . Einzelbild · N/P nächste/vorige Szene</p>`;
  wire(sc);
}
function actionLabel(r){ return r.action==="dismiss" ? "verworfen" : r.action==="confirm" ? "übernommen" : `${DEC[r.decision]||r.decision}${r.sanction && r.sanction!=="none" ? ", "+SAN[r.sanction] : ""}`; }
function wire(sc){
  const v = $("#vid");
  $("#snd").onclick = e => { v.muted = !v.muted; e.target.textContent = v.muted ? "Ton an" : "Ton aus"; };
  document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { v.playbackRate = +b.dataset.rate; document.querySelectorAll("[data-rate]").forEach(x => x.classList.toggle("on", x===b)); });
  $("#back").onclick = () => step(-1); $("#fwd").onclick = () => step(1);
  $("#aOk").onclick = () => act("confirm"); $("#aNo").onclick = () => act("dismiss"); $("#aFix").onclick = openForm;
  $("#fCancel").onclick = () => $("#form").classList.remove("open");
  $("#form").onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); save({action:"correct", ...Object.fromEntries(f), agrees_with_ai: sc.ai ? f.get("decision")===sc.ai.decision : null}); };
  $("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1);
  swipe($("#card"));
}
function step(n){ const v = $("#vid"); v.pause(); v.currentTime = Math.max(0, v.currentTime + n*0.04); }
function openForm(){ $("#form").classList.add("open"); $("#form select").focus(); }
function act(action){
  const sc = S.list[S.idx], ai = sc.ai;
  const base = {action, agrees_with_ai: action==="confirm" && ai ? true : null};
  if(action==="confirm") Object.assign(base, ai ? {decision:ai.decision, foul_type:ai.foul_type, sanction:ai.sanction} : {decision:"relevant"});
  if(action==="dismiss") base.decision = "not_relevant";
  save(base, action==="confirm" ? "swipe-r" : "swipe-l");
}
async function save(review, anim){
  const sc = S.list[S.idx];
  review = {...review, scene_id: key(sc), role: S.role};
  const res = await fetch(`/api/matches/${encodeURIComponent(S.matchId)}/reviews`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(review)});
  if(!res.ok){ $("#saved").textContent = "Speichern fehlgeschlagen."; return; }
  S.data.reviews[`${key(sc)}:${S.role}`] = review;
  if(anim) $("#card").classList.add(anim);
  setTimeout(() => { if(S.filter !== "open") S.idx++; rebuild(false); }, anim ? 180 : 0);
}
function go(n){ S.idx = Math.max(0, Math.min(S.list.length-1, S.idx+n)); render(); }
function swipe(el){
  let x0=null, y0=null;
  el.addEventListener("pointerdown", e => { if(e.target.closest("button,select,textarea,video")) return; x0=e.clientX; y0=e.clientY; });
  el.addEventListener("pointerup", e => { if(x0===null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>80 && Math.abs(dx)>Math.abs(dy)) act(dx>0 ? "confirm" : "dismiss"); else if(dy<-80) openForm(); });
}
document.addEventListener("keydown", e => {
  if(e.target.closest("textarea,select") || !S.list.length) return;
  const v = $("#vid");
  if(e.key==="ArrowRight") act("confirm"); else if(e.key==="ArrowLeft") act("dismiss"); else if(e.key==="ArrowUp"){ e.preventDefault(); openForm(); }
  else if(e.key===" " && v){ e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if(e.key===",") step(-1); else if(e.key===".") step(1);
  else if(e.key==="n") go(1); else if(e.key==="p") go(-1);
});
init();
</script>
</body>
</html>
